name: session-triage
version: "0.1.1"
description: >-
  Detect abandoned Hermes sessions, diagnose the background cause, repair it, and resume the turn
  once — never resuming a session the user stopped or closed deliberately.
author: pasei
license: MIT
requires_hermes: ">=0.21.0"
# `hooks:` and `provides_hooks:` list what `register()` actually registers. The loader's capability
# probe compares them against the `register_hook` names, so a hook named here but not registered (or
# the reverse) reads as capability creep.
hooks:
  - on_session_end
  - agent_loop_stopped
provides_hooks:
  - on_session_end
  - agent_loop_stopped
provides_tools:
  - session_triage
